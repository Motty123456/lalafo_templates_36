<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить товар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1d1f2b;
            --muted: #7b7f93;
            --accent: #6c5ce7;
            --accent-2: #a29bfe;
            --red: #e17055;
            --red-dark: #d63031;
            --shadow: 0 4px 20px rgba(30, 30, 60, 0.07);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            padding: 64px 20px 130px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 46px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 520px;
            margin: -80px auto 60px;
            padding: 0 20px;
        }

        .card {
            background: var(--card);
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 40px 34px 34px;
            text-align: center;
        }

        .icon {
            width: 84px;
            height: 84px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #fde9e3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .card h2 {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.3;
        }

        .name {
            display: inline-block;
            margin-top: 14px;
            background: #efedff;
            color: var(--accent);
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
        }

        .card p {
            margin-top: 16px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: transform .3s, box-shadow .3s, background .3s;
        }

        .btn-cancel {
            background: #efedff;
            color: var(--accent);
        }

        .btn-cancel:hover {
            background: #e3dffe;
            transform: translateY(-3px);
        }

        .btn-delete {
            background: linear-gradient(135deg, var(--red-dark), var(--red));
            color: #fff;
        }

        .btn-delete:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(214, 48, 49, .35);
        }

        @media (max-width: 480px) {
            .card { padding: 30px 22px 24px; }
            .actions { flex-direction: column-reverse; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Удаление товара</h1>
    </header>

    <main class="container">
        <form method="post" class="card">
            {% csrf_token %}

            <div class="icon">🗑</div>
            <h2>Вы уверены, что хотите удалить этот товар?</h2>
            <span class="name">{{ product.product_name }}</span>
            <p>Это действие нельзя отменить. Товар будет удалён навсегда.</p>

            <div class="actions">
                <a href="{% url 'product_detail' product.pk %}" class="btn btn-cancel">Отмена</a>
                <button type="submit" class="btn btn-delete">Да, удалить</button>
            </div>
        </form>
    </main>

</body>
</html>
