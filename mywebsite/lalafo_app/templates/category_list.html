<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1d1f2b;
            --muted: #7b7f93;
            --accent: #6c5ce7;
            --accent-2: #a29bfe;
            --shadow: 0 4px 20px rgba(30, 30, 60, 0.07);
            --shadow-hover: 0 18px 40px rgba(108, 92, 231, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .hero {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            padding: 64px 20px 90px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 46px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .hero p {
            margin-top: 12px;
            font-size: 17px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: -50px auto 60px;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 26px;
        }

        .card {
            position: relative;
            display: block;
            background: var(--card);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .card-img {
            position: relative;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #e9eaf2;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .5s ease;
        }

        .card:hover .card-img img { transform: scale(1.08); }

        .card-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(20, 20, 40, .35), transparent 55%);
        }

        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--accent-2);
        }

        .card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
        }

        .arrow {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #efedff;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background .3s, color .3s, transform .3s;
        }

        .card:hover .arrow {
            background: var(--accent);
            color: #fff;
            transform: translateX(4px);
        }

        .empty {
            text-align: center;
            background: var(--card);
            border-radius: 22px;
            padding: 60px 20px;
            box-shadow: var(--shadow);
            color: var(--muted);
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .card-body { padding: 12px 14px; }
            .card-title { font-size: 15px; }
            .arrow { display: none; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Категории</h1>
        <p>Выберите нужный раздел</p>
    </header>

    <main class="container">
        {% if categories %}
            <div class="grid">
                {% for i in categories %}
                    <a href="#" class="card">
                        <div class="card-img">
                            {% if i.category_image %}
                                <img src="{{ i.category_image.url }}" alt="{{ i.category_name }}">
                            {% else %}
                                <div class="placeholder">🖼</div>
                            {% endif %}
                        </div>
                        <div class="card-body">
                            <span class="card-title">{{ i.category_name }}</span>
                            <span class="arrow">→</span>
                        </div>
                    </a>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">Пока нет ни одной категории 😔</div>
        {% endif %}
    </main>

</body>
</html>
